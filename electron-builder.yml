appId: com.echo-dc.app
productName: Echo-DC
directories:
  buildResources: resources
  output: release
files:
  - out/**/*
  - package.json
win:
  executableName: Echo-DC
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: Echo-DC-Setup-${version}.${ext}
  shortcutName: Echo-DC
  uninstallDisplayName: Echo-DC
  createDesktopShortcut: always
portable:
  artifactName: Echo-DC-Portable-${version}.${ext}
